[run]
sample = 'test'
ncores = 32
plot = false
overwrite = true
source_mode = 'catalog' # 'catalog' (galaxy table) or 'map' (healpix lensing cube from shearmap/)
#gravity = ['GR', 'MG']

[profile]
rin = 0.1
rout = 3.0
nbins = 15
njk = 100
jk_seed = 0 # seed of the k-means of the jackknife regions: same seed, same regions
nside = 64
addnoise = false
# nback = 10.0 # not implemented yet: density of sources [arcmin^-2] to degrade the galaxy catalog to
binning = 'lin' # 'lin' or 'log'

[lenses]
z_edges = [0.1, 0.2] # redshift edges to cut between
rv_edges = [10.0, 20.0]
voidtype = ['mixed'] # ['mixed', 'S', 'R']
# delta_edges = [-1.0, 10.0] # TODO: add the option to cut by delta values
flag = 2.0

[lenses.gr]
name = '~/cats/L768/voids_LCDM_09.dat'

[lenses.mg]
name = '~/cats/L768/voids_fR_09.dat'

[lenses.columns]
# column numbers of the void files, which have no ID column. They are used to cut the voids
rv = 0 # void radius
ra = 1
dec = 2
z = 3 #redshift
rho1 = 7 # integrated density contrast at the void centre
delta = 8 # integrated density between 2-3 Rv, for void classification
flag = 11 # proximity to the survey wall (see [lenses] flag)

[randoms]
# Random voids of the subtraction (Singh et al. 2017), generated in each stack, not read from a file.
# Same (Rv, z) as the voids of the stack, uniform on the source footprint.
factor = 10 # number of randoms per void
seed = 42

[sources]

[sources.gr]
name = '~/cats/L768/l768_gr_z020-130_wpix64_23087.fits'
pix2idx = '~/cats/L768/pix2idx_gr_23087.npz'
cube = '~/cats/L768/lensing-cube_gr.fits' # map mode

[sources.mg]
name = '~/cats/L768/l768_mg_z020-130_wpix64_23086.fits'
pix2idx = '~/cats/L768/pix2idx_mg_23086.npz'
cube = '~/cats/L768/lensing-cube_mg.fits' # map mode

[sources.map]
# only used if source_mode = 'map'
# The sources of a void bin [z_low, z_high) are the cube slices from the first edge at or
# above z_high + dz_buffer (if it isn't an edge, the next one: fewer sources), so every void
# is at least dz_buffer in front of its sources. Any bin width works.
dz_buffer = 0.1
weighting = 'invsc' # sources weighted by 1/sigma_crit (the only one for now)
# order = 10 # optional: degrade the cube to this HEALPix order when loading it

[sources.columns]
# column names of source cat
ra = 'ra_gal'
dec = 'dec_gal'
redshift = 'redshift'
pix = 'pix'
kappa = 'kappa'
gamma1 = 'gamma1'
gamma2 = 'gamma2'
eps1 = 'eps1'
eps2 = 'eps2'

[cosmology]
# L768 simulation (matches the comoving distances r_gal of the lensing cube)
h = 1.0
Om0 = 0.3089
Ob0 = 0.0486
Ode0 = 0.6911
